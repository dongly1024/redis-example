// Generated by https://start.springboot.io
// 优质的 spring/boot/data/security/cloud 框架中文文档尽在 => https://springdoc.cn
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'top.keir'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenLocal()
    maven { url = 'https://maven.aliyun.com/repository/spring'}
    mavenCentral()
}

dependencies {
    implementation("org.dromara.hutool:hutool-all:6.0.0-M22")
    implementation('org.redisson:redisson-spring-boot-starter:3.50.0') {
        exclude group: 'org.redisson', module: 'redisson-spring-data-35'
    }
    implementation("org.redisson:redisson-spring-data-34:3.50.0")
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    def byteBuddyAgentJar = configurations.testRuntimeClasspath.find { it.name.contains('byte-buddy-agent') }
    if (byteBuddyAgentJar) {
        jvmArgs "-javaagent:${byteBuddyAgentJar.absolutePath}"
    }
}
